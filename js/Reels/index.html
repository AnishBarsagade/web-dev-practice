<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reels</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section>
      <div class="all-reels">
        <div class="reel">
          <img class='main-img' src="https://images.unsplash.com/photo-1614983647365-2094080e311f?q=80&w=686&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
          <div class="bottom">
            <div class="user">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
              <h4>Monkey D. Luffy</h4>
              <button>Follow</button>
            </div>
            <h3>Lorem, ipsum dolor sit amet consectetur adipisicing elit hello.</h3>
          </div>
          <div class="right">
            <div class="like icon">
              <h4 class="like-icon"><i class="ri-heart-3-line"></i></h4>
              <h6>200</h6>
            </div>
            <div class="comment icon">
              <h4 class="comment-icon"><i class="ri-chat-3-line"></i></h4>
              <h6>50</h6>
            </div>
            <div class="share icon">
              <h4 class="share-icon"><i class="ri-share-forward-line"></i></h4>
              <h6>50</h6>
            </div>
            <div class="menu icon">
              <h4 class="menu-icon"><i class="ri-more-2-fill"></i></i></h4>
            </div>
          </div>
        </div>
        <div class="reel">
          <img class='main-img' src="https://images.unsplash.com/photo-1516569333566-9d463ccffd20?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
          <div class="bottom">
            <div class="user">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=764&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="">
              <h4>Monkey D. Luffy</h4>
              <button>Follow</button>
            </div>
            <h3>Lorem, ipsum dolor sit amet consectetur adipisicing elit hello.</h3>
          </div>
          <div class="right">
            <div class="like icon">
              <h4 class="like-icon"><i class="ri-heart-3-line"></i></h4>
              <h6>200</h6>
            </div>
            <div class="comment icon">
              <h4 class="comment-icon"><i class="ri-chat-3-line"></i></h4>
              <h6>50</h6>
            </div>
            <div class="share icon">
              <h4 class="share-icon"><i class="ri-share-forward-line"></i></h4>
              <h6>50</h6>
            </div>
            <div class="menu icon">
              <h4 class="menu-icon"><i class="ri-more-2-fill"></i></i></h4>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
